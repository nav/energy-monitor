apiVersion: v1
kind: ConfigMap
metadata:
  name: energy-monitor-dashboard
  namespace: energy-monitor
  labels:
    # Picked up automatically by the existing Grafana sidecar (grafana-sc-dashboard)
    # in the metrics namespace, which watches every namespace for this label.
    grafana_dashboard: "1"
data:
  energy-monitor.json: |
    {
      "title": "Energy Monitor (Rainforest EAGLE)",
      "uid": "energy-monitor",
      "schemaVersion": 39,
      "timezone": "browser",
      "time": { "from": "now-6h", "to": "now" },
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "title": "Demand (W)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus" },
          "targets": [
            {
              "expr": "eagle_demand_watts",
              "legendFormat": "Demand",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "Cumulative Energy (kWh)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus" },
          "targets": [
            {
              "expr": "eagle_summation_delivered_kwh",
              "legendFormat": "Delivered",
              "refId": "A"
            },
            {
              "expr": "eagle_summation_received_kwh",
              "legendFormat": "Received",
              "refId": "B"
            }
          ]
        },
        {
          "id": 3,
          "title": "Current Price",
          "type": "stat",
          "gridPos": { "h": 4, "w": 12, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus" },
          "targets": [
            {
              "expr": "eagle_price_per_kwh",
              "legendFormat": "{{currency}}/kWh",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "decimals": 4 } }
        },
        {
          "id": 4,
          "title": "Estimated Cost Rate ($/hour)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 12, "x": 12, "y": 16 },
          "datasource": { "type": "prometheus" },
          "targets": [
            {
              "expr": "eagle_price_per_kwh * eagle_demand_watts / 1000",
              "legendFormat": "Cost/hour at current demand",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "decimals": 3 } }
        },
        {
          "id": 5,
          "title": "Seconds Since Last Upload",
          "type": "stat",
          "gridPos": { "h": 4, "w": 24, "x": 0, "y": 20 },
          "datasource": { "type": "prometheus" },
          "targets": [
            {
              "expr": "time() - eagle_last_upload_timestamp_seconds",
              "legendFormat": "Staleness",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 120 },
                  { "color": "red", "value": 300 }
                ]
              }
            }
          }
        },
        {
          "id": 6,
          "title": "Daily Consumption, Long Term (kWh/day)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 24 },
          "datasource": { "type": "prometheus", "uid": "dfye7iqan06ioe" },
          "description": "Widen the dashboard time range to see multiple months/years — this panel reads from the dedicated long-retention Prometheus instance, not the cluster's main one.",
          "targets": [
            {
              "expr": "increase(eagle_summation_delivered_kwh[1d])",
              "legendFormat": "Delivered / day",
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "title": "Cost Accrued, Long Term ($)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 32 },
          "datasource": { "type": "prometheus", "uid": "dfye7iqan06ioe" },
          "description": "Widen the dashboard time range to see multiple months/years — this panel reads from the dedicated long-retention Prometheus instance, not the cluster's main one.",
          "targets": [
            {
              "expr": "eagle_cost_accrued_dollars",
              "legendFormat": "Cost accrued",
              "refId": "A"
            }
          ]
        }
      ]
    }
