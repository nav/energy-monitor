apiVersion: v1
kind: ConfigMap
metadata:
  name: energy-monitor-dashboard
  namespace: energy-monitor
  labels:
    # Picked up automatically by the existing Grafana sidecar (grafana-sc-dashboard)
    # in the metrics namespace, which watches every namespace for this label.
    grafana_dashboard: "1"
data:
  energy-monitor.json: |
    {
      "title": "Energy Monitor (Rainforest EAGLE)",
      "uid": "energy-monitor",
      "schemaVersion": 39,
      "timezone": "browser",
      "time": { "from": "now-6h", "to": "now" },
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "title": "Demand (kW)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus" },
          "description": "Wrapped in sum() to collapse the separate series Prometheus otherwise keeps per pod/instance across redeploys — without it, every restart adds another duplicate legend entry.",
          "targets": [
            {
              "expr": "sum(eagle_demand_kw)",
              "legendFormat": "Demand",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "Cumulative Energy (kWh)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus" },
          "targets": [
            {
              "expr": "sum(eagle_summation_delivered_kwh)",
              "legendFormat": "Delivered",
              "refId": "A"
            },
            {
              "expr": "sum(eagle_summation_received_kwh)",
              "legendFormat": "Received",
              "refId": "B"
            }
          ]
        },
        {
          "id": 3,
          "title": "Current TOU Rate ($/kWh)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 12, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus" },
          "description": "The time-of-use rate actually used to compute cost (package tou) -- not the EAGLE's own reported eagle_price_per_kwh, which doesn't reflect the utility's time-of-use adjustments and is informational only.",
          "targets": [
            {
              "expr": "sum(energy_tou_rate_dollars_per_kwh)",
              "legendFormat": "TOU rate/kWh",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "decimals": 4 } }
        },
        {
          "id": 4,
          "title": "Estimated Cost Rate ($/hour)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 12, "x": 12, "y": 16 },
          "datasource": { "type": "prometheus" },
          "targets": [
            {
              "expr": "sum(energy_tou_rate_dollars_per_kwh * eagle_demand_kw)",
              "legendFormat": "Cost/hour at current demand",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "decimals": 3 } }
        },
        {
          "id": 5,
          "title": "Seconds Since Last Upload",
          "type": "stat",
          "gridPos": { "h": 4, "w": 24, "x": 0, "y": 20 },
          "datasource": { "type": "prometheus" },
          "targets": [
            {
              "expr": "time() - sum(eagle_last_upload_timestamp_seconds)",
              "legendFormat": "Staleness",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 120 },
                  { "color": "red", "value": 300 }
                ]
              }
            }
          }
        },
        {
          "id": 6,
          "title": "Daily Consumption, Long Term (kWh/day)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 24 },
          "datasource": { "type": "prometheus", "uid": "dfye7iqan06ioe" },
          "description": "Widen the dashboard time range to see multiple months/years — this panel reads from the dedicated long-retention Prometheus instance, not the cluster's main one.",
          "targets": [
            {
              "expr": "sum(increase(eagle_summation_delivered_kwh[1d]))",
              "legendFormat": "Delivered / day",
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "title": "Cost Accrued, Long Term ($)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 32 },
          "datasource": { "type": "prometheus", "uid": "dfye7iqan06ioe" },
          "description": "Widen the dashboard time range to see multiple months/years — this panel reads from the dedicated long-retention Prometheus instance, not the cluster's main one.",
          "targets": [
            {
              "expr": "sum(eagle_cost_accrued_dollars)",
              "legendFormat": "Cost accrued",
              "refId": "A"
            }
          ]
        },
        {
          "id": 8,
          "title": "Cost Today ($)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 8, "x": 0, "y": 40 },
          "datasource": { "type": "prometheus", "uid": "dfye7iqan06ioe" },
          "targets": [
            {
              "expr": "sum(increase(eagle_cost_accrued_dollars[1d]))",
              "legendFormat": "Today",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "currencyUSD", "decimals": 2 } }
        },
        {
          "id": 9,
          "title": "Cost This Week ($)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 8, "x": 8, "y": 40 },
          "datasource": { "type": "prometheus", "uid": "dfye7iqan06ioe" },
          "targets": [
            {
              "expr": "sum(increase(eagle_cost_accrued_dollars[7d]))",
              "legendFormat": "This week",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "currencyUSD", "decimals": 2 } }
        },
        {
          "id": 10,
          "title": "Cost This Month ($)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 8, "x": 16, "y": 40 },
          "datasource": { "type": "prometheus", "uid": "dfye7iqan06ioe" },
          "targets": [
            {
              "expr": "sum(increase(eagle_cost_accrued_dollars[30d]))",
              "legendFormat": "This month",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "currencyUSD", "decimals": 2 } }
        }
      ]
    }
