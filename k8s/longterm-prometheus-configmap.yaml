apiVersion: v1
kind: ConfigMap
metadata:
  name: energy-monitor-longterm-prometheus-config
  namespace: energy-monitor
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
    scrape_configs:
      - job_name: energy-monitor
        static_configs:
          - targets: ["energy-monitor.energy-monitor.svc.cluster.local:8080"]
