apiVersion: apps/v1
kind: Deployment
metadata:
  name: energy-monitor-longterm-prometheus
  namespace: energy-monitor
  labels:
    app: energy-monitor-longterm-prometheus
spec:
  replicas: 1
  strategy:
    # Recreate rather than RollingUpdate: this Deployment mounts a ReadWriteOnce PVC, so a
    # rolling update would leave the new pod stuck waiting for the old one to release it.
    type: Recreate
  selector:
    matchLabels:
      app: energy-monitor-longterm-prometheus
  template:
    metadata:
      labels:
        app: energy-monitor-longterm-prometheus
    spec:
      securityContext:
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=730d
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: energy-monitor-longterm-prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: energy-monitor-longterm-prometheus-data
