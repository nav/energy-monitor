apiVersion: v1
kind: Service
metadata:
  name: energy-monitor
  namespace: energy-monitor
  labels:
    app: energy-monitor
spec:
  type: NodePort
  selector:
    app: energy-monitor
  ports:
    - name: http
      port: 8080
      targetPort: http
      # nodePort left unset - k8s will assign one in the 30000-32767 range;
      # check it with `kubectl get svc -n energy-monitor` after applying.
